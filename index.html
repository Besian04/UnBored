<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <script src="Javascript/MainService.js"></script>
  <script src="Javascript/LocalStorageManager.js"></script>
  <script src="Javascript/ActivityRepository.js"></script>
  <script src="Javascript/Activity.js"></script>
  <script src="Javascript/UiController.js"></script>
  <script src="Javascript/User.js"></script>
</head>
<body>
    <h1>Unbored</h1>
    <div id="categories"></div>
    <div id="addActivityForm">
      <form id="activityForm">
        <div>
          <label for="activityName">Name</label>
          <input type="text" id="activityName" name="name" required>
        </div>

        <div>
          <label for="activityType">Type</label>
          <select id="activityType" name="type" required>
            <option value="music">Music</option>
            <option value="outdoor">Outdoor</option>
            <option value="game">Game</option>
            <option value="movie">Movie</option>
            <option value="show">Show</option>
          </select>
        </div>

        <div>
          <label for="activityDescription">Description</label>
          <input type="text" id="activityDescription" name="description" required>
        </div>

        <div>
          <label for="activityTime">Time</label>
          <input type="time" id="activityTime" name="time" required>
        </div>

        <div>
          <label for="activityRating">Rating</label>
          <input type="number" id="activityRating" name="rating" min="1" max="5" required>
        </div>

        <div>
          <label for="activityLink">Link</label>
          <input type="url" id="activityLink" name="link">
        </div>

        <div>
          <label for="activityImage">Image URL</label>
          <input type="url" id="activityImage" name="image">
        </div>

        <button type="submit">Add Activity</button>
      </form>
    </div>
    
</body>
</html>
